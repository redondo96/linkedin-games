<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pinpoint</title>

<style>

:root{
    --bg:#f3f2ef;
    --card:#ffffff;

    --blue1:#cfe4ff;
    --blue2:#a9ccff;
    --blue3:#7fb1ff;
    --blue4:#4d92ff;
    --blue5:#0a66c2;

    --green:#057642;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:var(--bg);

    font-family:-apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

    display:flex;

    justify-content:center;

    padding:40px 20px;
}

.container{

    width:100%;
    max-width:550px;
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:700;
    margin-bottom:25px;
}

.card{
    background:var(--card);
    border-radius:14px;
    padding:24px;
    box-shadow:
    0 2px 10px rgba(0,0,0,.08);
}

.pinpoint-table{
    overflow:hidden;
    border-radius:12px;
    margin-bottom:20px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:
    1px solid rgba(255,255,255,.2);
    transition:all .35s ease;
}

.row:last-child{
    border-bottom:none;
}

.row1{background:var(--blue1); color:#1d2226;}
.row2{background:var(--blue2); color:#1d2226;}
.row3{background:var(--blue3); color:white;}
.row4{background:var(--blue4); color:white;}
.row5{background:var(--blue5); color:white;}

.row-hidden{
    height:42px;
    font-size:15px;
    font-weight:500;
    color:rgba(255,255,255,.65);
}

.row-revealed{
    height:82px;
    font-size:24px;
    font-weight:700;
}

.placeholder{
    text-transform:uppercase;
    letter-spacing:.8px;
    opacity:.65;
}

.answer-row{
    background:var(--green);
    color:white;
    height:88px;
    font-size:26px;
    font-weight:800;
    animation:slideIn .35s ease;
}

input{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:1px solid #d0d0d0;
    font-size:16px;
}

button{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0a66c2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.95;
}

.feedback{
    min-height:28px;
    margin-top:15px;
    font-weight:600;
}

.success{
    color:var(--green);
}

.error{
    color:#b42318;
}

.stats{
    margin-top:12px;
    color:#666;
    line-height:1.6;
}

.guesses{
    margin-top:25px;
}

.guesses h3{
    font-size:14px;
    color:#666;
    margin-bottom:10px;
}

.guess{
    text-decoration:line-through;
    color:#888;
    margin-bottom:4px;
}

.hidden{
    display:none;
}

.reveal{
    animation:flip .35s ease;
}

@keyframes flip{

    from{

        transform:
        rotateX(90deg);

        opacity:0;
    }

    to{

        transform:
        rotateX(0);

        opacity:1;
    }
}

@keyframes slideIn{

    from{

        opacity:0;

        transform:
        translateY(-15px);
    }

    to{

        opacity:1;

        transform:
        translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
Pinpoint
</div>

<div class="card">

<div id="table"
class="pinpoint-table">
</div>

<div id="playArea">

<input
id="guessInput"
placeholder="Enter your guess..."
autocomplete="off">

<button id="submitBtn">
Submit
</button>

</div>

<div
id="feedback"
class="feedback">
</div>

<div
id="stats"
class="stats">
</div>

<div class="guesses">

<h3>
Previous guesses
</h3>

<div id="guessList"></div>

</div>

</div>

</div>

<script>

/****************************************/
/* EDIT ONLY THIS BLOCK */
/****************************************/

const ANSWER =
"State Farm Arena";

const CLUES = [
"Baloncesto",
"NBA",
"Jumbotron",
"Hawks",
"Estadio"
];

/****************************************/

let visibleClues = 1;
let attempts = 0;
let incorrect = 0;
let solved = false;

const table =
document.getElementById("table");

const input =
document.getElementById("guessInput");

const feedback =
document.getElementById("feedback");

const guessList =
document.getElementById("guessList");

const stats =
document.getElementById("stats");

const playArea =
document.getElementById("playArea");

function normalize(text){

    return text

    .toLowerCase()

    .trim()

    .normalize("NFD")

    .replace(
        /[\u0300-\u036f]/g,
        ""
    );
}

function renderTable(){

    table.innerHTML = "";

    for(let i=0;i<5;i++){

        const row =
        document.createElement("div");

        row.classList.add(
            "row",
            "row"+(i+1)
        );

        if(i < visibleClues){

            row.classList.add(
                "row-revealed",
                "reveal"
            );

            row.textContent =
            CLUES[i];

        }else{

            row.classList.add(
                "row-hidden"
            );

            row.innerHTML =
            `<span class="placeholder">
            Pista ${i+1}
            </span>`;
        }

        table.appendChild(row);
    }

    if(solved){

        const answerRow =
        document.createElement("div");

        answerRow.className =
        "row answer-row";

        answerRow.textContent =
        ANSWER;

        table.appendChild(
            answerRow
        );
    }
}

renderTable();

function submitGuess(){

    if(solved) return;

    const guess =
    input.value.trim();

    if(!guess) return;

    attempts++;

    if(
        normalize(guess)
        ===
        normalize(ANSWER)
    ){

        visibleClues =
        CLUES.length;

        solved = true;

        renderTable();

        feedback.textContent =
        "🎉 Correct!";

        feedback.className =
        "feedback success";

        stats.innerHTML =
        `
        Solved with ${visibleClues} clues<br>
        Attempts: ${attempts}
        `;

        playArea.classList
        .add("hidden");

        return;
    }

    incorrect++;

    const wrongGuess =
    document.createElement("div");

    wrongGuess.className =
    "guess";

    wrongGuess.textContent =
    guess;

    guessList.appendChild(
        wrongGuess
    );

    if(
        visibleClues
        <
        CLUES.length
    ){

        visibleClues++;
    }

    renderTable();

    feedback.textContent =
    "Not quite. Another clue has been revealed.";

    feedback.className =
    "feedback error";

    input.value = "";

    input.focus();
}

document
.getElementById(
"submitBtn"
)
.addEventListener(
"click",
submitGuess
);

input.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

submitGuess();

}
});

</script>

</body>
</html>

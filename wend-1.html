<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>LinkedIn Games+ — Wend</title>
<style>
    :root {
        --page: #f7f9fc;
        --panel: #ffffff;
        --cell: #ffffff;
        --cell-border: #d9e2ec;
        --text: #182230;
        --muted: #6b7785;
        --accent: #0a66c2;
        --accent-soft: #e8f3ff;
        --success: #14866d;
        --success-soft: #e6f7f2;
        --error: #c93756;
        --error-soft: #fdebf0;
        --blocked: #e7ebef;
        --shadow: 0 12px 35px rgba(26, 48, 75, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        min-height: 100%;
        background: var(--page);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    body {
        display: flex;
        justify-content: center;
        padding: 28px 16px 40px;
    }

    .game {
        width: min(620px, 100%);
    }

    .board-wrap {
        background: var(--panel);
        border-radius: 22px;
        padding: clamp(12px, 3vw, 20px);
        box-shadow: var(--shadow);
    }

    #board {
        --rows: 5;
        --cols: 6;
        display: grid;
        grid-template-columns: repeat(var(--cols), 1fr);
        grid-template-rows: repeat(var(--rows), 1fr);
        gap: clamp(5px, 1.1vw, 8px);
        width: 100%;
        aspect-ratio: 6 / 5;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .cell {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        border: 2px solid var(--cell-border);
        border-radius: clamp(9px, 1.7vw, 14px);
        background: var(--cell);
        font-size: clamp(23px, 5vw, 34px);
        font-weight: 750;
        line-height: 1;
        color: var(--text);
        cursor: pointer;
        transition: transform 100ms ease, background 120ms ease, border-color 120ms ease,
                    color 120ms ease, box-shadow 120ms ease;
        overflow: hidden;
    }

    .cell.blocked {
        border-color: #d8dee5;
        background: var(--blocked);
        cursor: default;
        pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
    }

    .cell.selected {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
        transform: scale(0.96);
        box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.09);
        z-index: 2;
    }

    .cell.locked {
        color: #fff;
        border-color: rgba(255,255,255,.18);
        cursor: default;
        transform: scale(0.96);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
        pointer-events: none;
    }

    .cell.incorrect {
        background: var(--error-soft);
        border-color: var(--error);
        color: var(--error);
        animation: shake 230ms ease-in-out;
    }

    .cell.correct-pop {
        animation: pop 280ms cubic-bezier(.2,.8,.25,1.2);
    }

    /* Soft pastel colours for solved words. The center is lightly translucent/whitened. */
    .cell.word-color-0 {
        background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.48) 0%, rgba(226,241,252,.90) 68%, rgba(214,234,250,.98) 100%) !important;
        border-color: #c7deef !important;
        color: #245477 !important;
    }
    .cell.word-color-1 {
        background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.52) 0%, rgba(238,233,255,.90) 68%, rgba(228,220,251,.98) 100%) !important;
        border-color: #d8cef2 !important;
        color: #5d4c86 !important;
    }
    .cell.word-color-2 {
        background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.50) 0%, rgba(224,244,238,.90) 68%, rgba(211,238,230,.98) 100%) !important;
        border-color: #c2e1d5 !important;
        color: #326b5a !important;
    }
    .cell.word-color-3 {
        background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.53) 0%, rgba(255,242,220,.90) 68%, rgba(251,231,198,.98) 100%) !important;
        border-color: #edd5aa !important;
        color: #8a6330 !important;
    }
    .cell.word-color-4 {
        background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.52) 0%, rgba(249,231,241,.90) 68%, rgba(243,214,230,.98) 100%) !important;
        border-color: #e7cbdc !important;
        color: #87536f !important;
    }

    .slots {
        margin-top: 18px;
        display: grid;
        gap: 8px;
    }

    .slot {
        min-height: 46px;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 7px 12px;
        border: 1px solid #e1e8f0;
        background: #fbfcfe;
        border-radius: 12px;
        transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .slot-length {
        min-width: 29px;
        font-size: 14px;
        font-weight: 750;
        color: var(--muted);
        text-align: center;
    }

    .slot-blank {
        letter-spacing: 3px;
        color: #b8c2cc;
        font-size: 18px;
        white-space: nowrap;
    }

    .slot-word {
        font-size: 15px;
        font-weight: 760;
        letter-spacing: .07em;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 180ms ease, transform 180ms ease;
    }

    .slot.solved {
        background: var(--success-soft);
        border-color: #c6e9df;
    }

    .slot.solved .slot-blank { display: none; }
    .slot.solved .slot-word {
        opacity: 1;
        transform: translateY(0);
        color: var(--success);
    }

    .controls {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 14px;
    }

    button {
        appearance: none;
        border: 1px solid #d7e0ea;
        background: #fff;
        color: #354251;
        border-radius: 10px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, transform 100ms ease;
    }

    button:hover { background: #f7f9fc; }
    button:active { transform: scale(.98); }
    button:disabled {
        opacity: .45;
        cursor: default;
        transform: none;
    }

    #status {
        min-height: 22px;
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
        font-weight: 650;
        color: var(--muted);
        opacity: 0;
        transition: opacity 150ms ease, color 150ms ease;
    }

    #status.show { opacity: 1; }
    #status.error { color: var(--error); }
    #status.success { color: var(--success); }

    .completion {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(247, 249, 252, 0.72);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
        z-index: 20;
    }

    .completion.show {
        opacity: 1;
        pointer-events: auto;
    }

    .completion-card {
        width: min(390px, 100%);
        background: #fff;
        border: 1px solid #e0e7ef;
        border-radius: 20px;
        box-shadow: 0 22px 60px rgba(26, 48, 75, 0.16);
        padding: 28px 24px 24px;
        text-align: center;
    }

    .completion-mark {
        width: 54px;
        height: 54px;
        margin: 0 auto 15px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--success-soft);
        color: var(--success);
        font-size: 26px;
        font-weight: 800;
    }

    .completion-title {
        margin: 0;
        font-size: 24px;
        letter-spacing: -.02em;
    }

    .completion-subtitle {
        margin: 8px 0 20px;
        font-size: 14px;
        color: var(--muted);
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        50% { transform: translateX(3px); }
        75% { transform: translateX(-2px); }
    }

    @keyframes pop {
        0% { transform: scale(.88); }
        60% { transform: scale(1.04); }
        100% { transform: scale(.96); }
    }

    @media (max-width: 420px) {
        body { padding: 14px 9px 28px; }
        .board-wrap { padding: 10px; border-radius: 18px; }
        .slot { min-height: 42px; padding: 6px 10px; }
        .slot-blank { font-size: 16px; }
    }

    .brand-header {
        text-align: center;
        margin: 0 0 18px;
        user-select: none;
    }

    .brand-name {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.15px;
    }

    .linkedin-word { color: #0a66c2; }
    .games-word { color: #252525; }

    .game-name {
        margin-top: 4px;
        font-size: 36px;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.8px;
        color: #171717;
    }

    @media (max-width: 520px) {
        .brand-header { margin-bottom: 14px; }
        .brand-name { font-size: 16px; }
        .game-name { font-size: 30px; }
    }

</style>
</head>
<body>
<main class="game">
    <header class="brand-header" aria-label="LinkedIn Games+ Wend">
        <div class="brand-name"><span class="linkedin-word">LinkedIn</span> <span class="games-word">Games+</span></div>
        <div class="game-name">Wend</div>
    </header>
    <section class="board-wrap">
        <div id="board" aria-label="Game board"></div>
        <div id="slots" class="slots" aria-live="polite"></div>
        <div id="status" aria-live="polite"></div>
    </section>
</main>

<div id="completion" class="completion" aria-hidden="true">
    <div class="completion-card">
        <div class="completion-mark">✓</div>
        <h1 class="completion-title">Puzzle complete!</h1>
        <p class="completion-subtitle">You found all the words.</p>
    </div>
</div>

<script>
const puzzle = {
    rows: 5,
    cols: 6,

    grid: [
        ["A", "M", null, "B", "O", null],
        ["R", "O", "E", "E", "R", "A"],
        ["P", "L", "M", "R", "M", "F"],
        [null, "A", "Y", "N", "U", "A"],
        [null, null, "A", "D", "A", "K"]
    ],

    words: [
        {
            word: "MUNDAKA",
            path: [
                [2, 4], [3, 4], [3, 3], [4, 3], [4, 4], [4, 5], [3, 5]
            ]
        },
        {
            word: "FARO",
            path: [
                [2, 5], [1, 5], [1, 4], [0, 4]
            ]
        },
        {
            word: "BERMEO",
            path: [
                [0, 3], [1, 3], [2, 3], [2, 2], [1, 2], [1, 1]
            ]
        },
        {
            word: "MAR",
            path: [
                [0, 1], [0, 0], [1, 0]
            ]
        },
        {
            word: "PLAYA",
            path: [
                [2, 0], [2, 1], [3, 1], [3, 2], [4, 2]
            ]
        }
    ]
};

// -----------------------------------------------------------------------------
// Validation: the page refuses to start with a malformed puzzle.
// -----------------------------------------------------------------------------
function validatePuzzle(data) {
    if (!Number.isInteger(data.rows) || !Number.isInteger(data.cols)) {
        throw new Error("Dimensiones inválidas.");
    }

    if (data.grid.length !== data.rows || data.grid.some(row => row.length !== data.cols)) {
        throw new Error("La cuadrícula no coincide con sus dimensiones.");
    }

    if (data.words.length === 0) throw new Error("No hay palabras.");

    const lengths = data.words.map(item => item.word.length);
    if (new Set(lengths).size !== lengths.length) {
        throw new Error("Las palabras deben tener longitudes distintas.");
    }

    const used = new Set();
    let pathCellCount = 0;

    data.words.forEach((item, wordIndex) => {
        const word = item.word;
        const path = item.path;

        if (!Array.isArray(path) || path.length !== word.length) {
            throw new Error(`Longitud de ruta incorrecta en ${word}.`);
        }

        for (let i = 0; i < path.length; i++) {
            const [r, c] = path[i];
            if (!Number.isInteger(r) || !Number.isInteger(c) || r < 0 || r >= data.rows || c < 0 || c >= data.cols) {
                throw new Error(`Coordenada inválida en ${word}.`);
            }

            if (data.grid[r][c] === null) {
                throw new Error(`La ruta de ${word} usa una casilla vacía.`);
            }

            if (data.grid[r][c] !== word[i]) {
                throw new Error(`La letra de ${word} no coincide en (${r},${c}).`);
            }

            const key = `${r},${c}`;
            if (used.has(key)) {
                throw new Error(`Solapamiento detectado en (${r},${c}).`);
            }
            used.add(key);
            pathCellCount++;

            if (i > 0) {
                const [pr, pc] = path[i - 1];
                const manhattan = Math.abs(r - pr) + Math.abs(c - pc);
                if (manhattan !== 1) {
                    throw new Error(`Movimiento no ortogonal en ${word}.`);
                }
            }
        }
    });

    const openCells = data.grid.flat().filter(cell => cell !== null).length;
    if (pathCellCount !== openCells) {
        throw new Error(`La cobertura no es exacta: ${pathCellCount} letras para ${openCells} casillas abiertas.`);
    }

    // Verify that each target word has exactly one undirected path in the board.
    // This still permits the player to enter the word in either direction.
    for (const item of data.words) {
        const count = countUniqueUndirectedPaths(data.grid, item.word, 2);
        if (count !== 1) {
            throw new Error(`La palabra ${item.word} tiene ${count} rutas posibles en la cuadrícula.`);
        }
    }
}

function countUniqueUndirectedPaths(grid, word, stopAfter = Infinity) {
    const rows = grid.length;
    const cols = grid[0].length;
    const found = new Set();

    function canonical(path) {
        const a = path.map(([r, c]) => `${r},${c}`).join("|");
        const b = [...path].reverse().map(([r, c]) => `${r},${c}`).join("|");
        return a < b ? a : b;
    }

    function dfs(r, c, index, used, path, target) {
        if (index === target.length - 1) {
            found.add(canonical(path));
            return found.size >= stopAfter;
        }

        const nextIndex = index + 1;
        for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            const key = `${nr},${nc}`;
            if (used.has(key)) continue;
            if (grid[nr][nc] !== target[nextIndex]) continue;

            used.add(key);
            path.push([nr, nc]);
            if (dfs(nr, nc, nextIndex, used, path, target)) return true;
            path.pop();
            used.delete(key);
        }
        return false;
    }

    // Search for the word and its reverse, then canonicalize so a path is counted once.
    for (const target of [word, [...word].reverse().join("")]) {
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (grid[r][c] !== target[0]) continue;
                const key = `${r},${c}`;
                if (dfs(r, c, 0, new Set([key]), [[r, c]], target)) return found.size;
            }
        }
    }
    return found.size;
}

validatePuzzle(puzzle);

const boardEl = document.getElementById("board");
const slotsEl = document.getElementById("slots");
const statusEl = document.getElementById("status");
const completionEl = document.getElementById("completion");

boardEl.style.setProperty("--rows", puzzle.rows);
boardEl.style.setProperty("--cols", puzzle.cols);

const cells = new Map();
const wordByLength = new Map(puzzle.words.map((item, index) => [item.word.length, { ...item, index }]));
const foundWords = new Map();
let currentPath = [];
let pointerDown = false;
let pointerMoved = false;
let pointerStart = null;
let statusTimer = null;

function cellKey(r, c) {
    return `${r},${c}`;
}

function buildBoard() {
    boardEl.innerHTML = "";
    cells.clear();

    puzzle.grid.forEach((row, r) => {
        row.forEach((letter, c) => {
            const el = document.createElement("div");
            el.className = "cell";
            el.dataset.row = r;
            el.dataset.col = c;

            if (letter === null) {
                el.classList.add("blocked");
                el.setAttribute("aria-hidden", "true");
            } else {
                el.textContent = letter;
                el.setAttribute("role", "gridcell");
                el.setAttribute("aria-label", letter);
                cells.set(cellKey(r, c), el);
            }

            boardEl.appendChild(el);
        });
    });
}

function buildSlots() {
    slotsEl.innerHTML = "";
    [...puzzle.words]
        .sort((a, b) => a.word.length - b.word.length)
        .forEach(item => {
            const slot = document.createElement("div");
            slot.className = "slot";
            slot.dataset.length = item.word.length;
            slot.innerHTML = `
                <span class="slot-length">${item.word.length} ${item.word.length === 1 ? "letter" : "letters"}</span>
                <span class="slot-blank">${"_ ".repeat(item.word.length).trim()}</span>
                <span class="slot-word">${item.word}</span>
            `;
            slotsEl.appendChild(slot);
        });
}

function setStatus(message = "", kind = "") {
    clearTimeout(statusTimer);
    statusEl.textContent = message;
    statusEl.className = message ? `show ${kind}` : "";
    if (message) {
        statusTimer = setTimeout(() => {
            statusEl.className = "";
            statusEl.textContent = "";
        }, 1300);
    }
}

function getCellFromPoint(clientX, clientY) {
    const element = document.elementFromPoint(clientX, clientY);
    if (!element) return null;
    const cell = element.closest(".cell:not(.blocked)");
    if (!cell || !boardEl.contains(cell)) return null;
    return cell;
}

function pathContains(r, c) {
    return currentPath.some(([pr, pc]) => pr === r && pc === c);
}

function isAdjacent(a, b) {
    return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
}

function isLocked(r, c) {
    const el = cells.get(cellKey(r, c));
    return el?.classList.contains("locked");
}

function clearSelection() {
    currentPath.forEach(([r, c]) => {
        const el = cells.get(cellKey(r, c));
        if (!el || el.classList.contains("locked")) return;
        el.classList.remove("selected", "incorrect");
    });
    currentPath = [];
}

function paintSelection() {
    currentPath.forEach(([r, c]) => {
        cells.get(cellKey(r, c))?.classList.add("selected");
    });
}

function addToPath(r, c) {
    if (isLocked(r, c)) return;

    if (currentPath.length === 0) {
        currentPath.push([r, c]);
        paintSelection();
        return;
    }

    const last = currentPath[currentPath.length - 1];
    const candidate = [r, c];

    // Backtrack one or more steps by dragging back over the existing path.
    const existingIndex = currentPath.findIndex(([pr, pc]) => pr === r && pc === c);
    if (existingIndex !== -1) {
        if (existingIndex === currentPath.length - 2) {
            const removed = currentPath.pop();
            cells.get(cellKey(...removed))?.classList.remove("selected");
        }
        return;
    }

    if (!isAdjacent(last, candidate)) return;
    currentPath.push(candidate);
    paintSelection();
}

function startSelection(cell) {
    const r = Number(cell.dataset.row);
    const c = Number(cell.dataset.col);
    if (isLocked(r, c)) return;
    clearSelection();
    currentPath = [[r, c]];
    paintSelection();
}

function finishSelection() {
    if (currentPath.length < 2) {
        clearSelection();
        return;
    }

    const selectedWord = currentPath.map(([r, c]) => puzzle.grid[r][c]).join("");
    const reversed = [...selectedWord].reverse().join("");
    const match = puzzle.words.find(item => !foundWords.has(item.word) && (item.word === selectedWord || item.word === reversed));

    if (!match) {
        currentPath.forEach(([r, c]) => {
            cells.get(cellKey(r, c))?.classList.add("incorrect");
        });
        setStatus("Not one of the words we're looking for.", "error");
        setTimeout(clearSelection, 420);
        return;
    }

    const solvedPath = currentPath.slice();
    foundWords.set(match.word, solvedPath);

    // Use the actual position of the word in puzzle.words.
    // match.index does not exist on the word objects, which previously made
    // solved cells lose their background colour.
    const wordIndex = puzzle.words.findIndex(item => item.word === match.word);
    const solvedClass = `word-color-${wordIndex}`;

    solvedPath.forEach(([r, c]) => {
        const el = cells.get(cellKey(r, c));
        if (!el) return;
        el.classList.remove("selected", "incorrect");
        // .locked + word-color-X is the permanent visual state.
        el.classList.add("locked", solvedClass, "correct-pop");
        el.dataset.solvedWord = match.word;
    });

    const slot = [...slotsEl.querySelectorAll(".slot")].find(el => Number(el.dataset.length) === match.word.length);
    slot?.classList.add("solved");

    currentPath = [];
    setStatus("Word found!", "success");

    if (foundWords.size === puzzle.words.length) {
        setTimeout(() => {
            completionEl.classList.add("show");
            completionEl.setAttribute("aria-hidden", "false");
        }, 480);
    }
}

function handlePointerDown(event) {
    const cell = event.target.closest(".cell:not(.blocked)");
    if (!cell || !boardEl.contains(cell)) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    event.preventDefault();
    pointerDown = true;
    pointerMoved = false;
    pointerStart = [event.clientX, event.clientY];
    boardEl.setPointerCapture?.(event.pointerId);
    startSelection(cell);
}

function handlePointerMove(event) {
    if (!pointerDown) return;
    event.preventDefault();

    if (pointerStart) {
        const distance = Math.hypot(event.clientX - pointerStart[0], event.clientY - pointerStart[1]);
        if (distance > 5) pointerMoved = true;
    }

    const cell = getCellFromPoint(event.clientX, event.clientY);
    if (!cell) return;

    addToPath(Number(cell.dataset.row), Number(cell.dataset.col));
}

function handlePointerUp(event) {
    if (!pointerDown) return;
    event.preventDefault();
    pointerDown = false;
    pointerStart = null;
    boardEl.releasePointerCapture?.(event.pointerId);
    finishSelection();
}

boardEl.addEventListener("pointerdown", handlePointerDown);
boardEl.addEventListener("pointermove", handlePointerMove);
boardEl.addEventListener("pointerup", handlePointerUp);
boardEl.addEventListener("pointercancel", handlePointerUp);


buildBoard();
buildSlots();
</script>
</body>
</html>
